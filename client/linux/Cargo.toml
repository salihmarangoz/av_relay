[package]
name = "av-relay"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Use another computer's camera and microphone on Ubuntu as a virtual webcam and mic"
repository = "https://github.com/salihmarangoz/av_relay"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.31", features = ["ioctl", "poll", "fs"] }
curve25519-dalek = "5"
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
snow = "0.10"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
ringbuf = "0.4"
gstreamer = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-sdp = "0.25"
gstreamer-app = "0.25"
gstreamer-rtp = { version = "0.25", features = ["v1_20"] }
mdns-sd = "0.21.5"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
ksni = "0.3"
cairo-rs = { version = "0.22", features = ["png"] }
pangocairo = "0.22"
pango = "0.22"

[profile.release]
lto = "thin"

[dev-dependencies]
hex = "0.4.3"

# The .deb (cargo deb). Plugins and services are loaded at run time, so
# they're listed by hand next to the linked libraries ($auto).
[package.metadata.deb]
name = "av-relay"
maintainer = "Salih Marangoz <salih285@gmail.com>"
copyright = "AV Relay contributors"
license-file = ["../../LICENSE", "0"]
section = "video"
priority = "optional"
extended-description = """\
AV Relay makes the camera and microphone of another computer, the sender, \
show up on Ubuntu as a regular webcam ("AV Relay Camera") and microphone \
("AV Relay Microphone") for any app, over the local network. The sender's \
camera and microphone run only while an app here uses them. The sender is \
the AV Relay app for macOS."""
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, gstreamer1.0-nice, pipewire, wireplumber, kmod"
recommends = "gnome-shell-extension-appindicator"
suggests = "linux-modules-v4l2loopback-generic-hwe-24.04, v4l2loopback-utils"
maintainer-scripts = "packaging/debian"
assets = [
    ["target/release/av-relay", "usr/bin/", "755"],
    ["packaging/io.github.salihmarangoz.avrelay.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.salihmarangoz.avrelay.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/autostart.desktop", "etc/xdg/autostart/io.github.salihmarangoz.avrelay.desktop", "644"],
    ["../../README.md", "usr/share/doc/av-relay/README.md", "644"],
    ["../../docs/linux.md", "usr/share/doc/av-relay/linux.md", "644"],
    ["scripts/devices-test.html", "usr/share/doc/av-relay/devices-test.html", "644"],
    ["packaging/70-av-relay.rules", "usr/lib/udev/rules.d/", "644"],
    ["packaging/modules-load.conf", "etc/modules-load.d/av-relay.conf", "644"],
    ["packaging/modprobe.conf", "etc/modprobe.d/av-relay.conf", "644"],
    ["../../assets/generated/linux/hicolor/scalable/apps/*", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/generated/linux/hicolor/symbolic/apps/*", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["../../assets/generated/linux/hicolor/16x16/apps/*", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../assets/generated/linux/hicolor/32x32/apps/*", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../assets/generated/linux/hicolor/48x48/apps/*", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../assets/generated/linux/hicolor/64x64/apps/*", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../assets/generated/linux/hicolor/128x128/apps/*", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../assets/generated/linux/hicolor/256x256/apps/*", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/generated/linux/hicolor/512x512/apps/*", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../assets/generated/linux/hicolor/22x22/status/*", "usr/share/icons/hicolor/22x22/status/", "644"],
    ["../../assets/generated/linux/hicolor/44x44/status/*", "usr/share/icons/hicolor/44x44/status/", "644"],
]
