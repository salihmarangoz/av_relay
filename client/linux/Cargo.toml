[package]
name = "av-relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Use a MacBook's camera and microphone on Ubuntu as a virtual webcam and mic"
repository = "https://github.com/salihmarangoz/av_relay_mac_to_linux"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.31", features = ["ioctl", "poll", "fs"] }
curve25519-dalek = "5"
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
snow = "0.10"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
ringbuf = "0.4"
gstreamer = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-sdp = "0.25"
gstreamer-app = "0.25"
gstreamer-rtp = { version = "0.25", features = ["v1_20"] }
mdns-sd = "0.21.5"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
ksni = "0.3"

[profile.release]
lto = "thin"

[dev-dependencies]
hex = "0.4.3"
