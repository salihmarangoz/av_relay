[package]
name = "av-relay-windows"
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "AV Relay receiver for Windows with a native settings window and tray icon"
publish = false

[features]
default = ["media"]
media = ["dep:gstreamer", "dep:gstreamer-webrtc", "dep:gstreamer-sdp", "dep:gstreamer-app", "dep:gstreamer-rtp", "windows-audio"]
windows-audio = ["dep:cpal", "dep:windows"]

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
curve25519-dalek = "5"
sha2 = "0.11.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
snow = "0.10"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
mdns-sd = "0.21.5"
gstreamer = { version = "0.25", optional = true }
gstreamer-webrtc = { version = "0.25", optional = true }
gstreamer-sdp = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-rtp = { version = "0.25", features = ["v1_20"], optional = true }
cpal = { version = "0.16", optional = true }
# The version cpal already uses; for audio sessions on the cable (micuse).
windows = { version = "0.54", optional = true, features = [
  "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
hex = "0.4.3"

[[example]]
name = "device-test"
path = "examples/device-test.rs"
required-features = ["windows-audio"]

[[example]]
name = "capture-lifecycle"
required-features = ["media"]

[profile.release]
lto = "thin"
strip = true
