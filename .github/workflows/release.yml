# On a version tag (v1.2.3, made by scripts/release.py): check that the
# tree says that version everywhere, build all three apps, and publish them as a
# GitHub Release, the Mac .zip/.dmg, Linux .deb and Windows installer, with the
# changelog's section as the notes. A version with a "-" (1.2.3-rc.1) is a
# pre-release. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Version and changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/release.py --check "$GITHUB_REF_NAME"

  macos:
    name: Mac app
    needs: check
    runs-on: macos-26
    defaults:
      run:
        working-directory: server/macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits
      - run: swift test
      - run: scripts/build-app.sh --version "${GITHUB_REF_NAME#v}" --out build
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            server/macos/build/AV-Relay-*-macOS.zip
            server/macos/build/AV-Relay-*-macOS.dmg

  linux:
    name: Linux .deb
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client/linux
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && scripts/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: client/linux/target/debian/av-relay_*.deb

  publish:
    name: Publish the release
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release with every artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          python3 -I scripts/release.py --notes "$GITHUB_REF_NAME" > notes.md
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "AV Relay ${GITHUB_REF_NAME#v}" --notes-file notes.md "${prerelease[@]}"

  windows:
    name: Windows installer
    needs: check
    uses: ./.github/workflows/windows-build.yml
    with:
      artifact-name: release-windows
