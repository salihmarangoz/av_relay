# On a version tag (v1.2.3): build both apps and publish them as a GitHub
# Release: the Mac .zip and .dmg, and the Linux .deb.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: Mac app
    runs-on: macos-26
    defaults:
      run:
        working-directory: server/macos
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits
      - run: swift test
      - run: scripts/build-app.sh --version "${GITHUB_REF_NAME#v}" --out build
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            server/macos/build/AV-Relay-*-macOS.zip
            server/macos/build/AV-Relay-*-macOS.dmg

  linux:
    name: Linux .deb
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client/linux
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && scripts/install-build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Take the version from the tag
        run: sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: client/linux/target/debian/av-relay_*.deb

  publish:
    name: Publish the release
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create the release with every artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "AV Relay ${GITHUB_REF_NAME#v}" --generate-notes
