# The Mac app and the shared test vectors: built and tested on main and on
# pull requests when they change, and on demand for a task branch
# (gh workflow run ci.yml --ref task/T14). The repository is private until
# its first release, so Actions minutes count, macOS ones ten times: no runs
# for every push to a task branch. The Linux client has linux.yml.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/protocol.md"
      - "tests/**"
      - "assets/generated/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/protocol.md"
      - "tests/**"
      - "assets/generated/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: Shared test vectors are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends libsodium23
      - run: python3 -m venv .venv-vectors && .venv-vectors/bin/pip install -q -r tests/vectors/requirements.txt
      - run: .venv-vectors/bin/python -I tests/vectors/generate.py --check

  macos:
    name: Mac app
    runs-on: macos-26
    defaults:
      run:
        working-directory: server/macos
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version && swift --version
      - name: Test (protocol vectors, server end to end, media loopback with test sources)
        run: swift test
      - name: Build AV Relay.app, .zip and .dmg (Apple silicon + Intel, ad hoc signed)
        if: hashFiles('server/macos/scripts/build-app.sh') != ''
        run: scripts/build-app.sh --version "0.0.0-ci.${GITHUB_RUN_NUMBER}" --out build
      - if: hashFiles('server/macos/scripts/build-app.sh') != ''
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            server/macos/build/AV-Relay-*-macOS.zip
            server/macos/build/AV-Relay-*-macOS.dmg
          retention-days: 7
